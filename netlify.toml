[build]
  publish = "public"
  command = "npm run build"
  functions = "lambda"
[build.environment]
  # Netlify's build image defaults to whatever Node it ships with, currently
  # 24. Pin it so the build does not change under us; mirrored in .nvmrc.
  NODE_VERSION = "22"
  YARN_VERSION = "1.9.4"
  YARN_FLAGS = "--no-ignore-optional"
